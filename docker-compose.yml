services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: gov_scheme_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d gov_scheme_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: gov_scheme_rag
      PGUSER: rag
      PGPASSWORD: rag
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount data/ read-write so scripts/ingest.py and
      # scripts/embed_and_store.py can be run inside the container
      # against your real PDFs without rebuilding the image.
      - ./data:/app/data

volumes:
  pgdata:
